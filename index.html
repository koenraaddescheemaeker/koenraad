<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koenraad — jouw digitale websitebouwer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="app">
    <section class="conversation">

        <header class="header">
            <div class="logo">Koenraad</div>
            <div class="subtitle">jouw digitale websitebouwer</div>
        </header>

        <div id="messages" class="messages">
            <div class="message koenraad">
                <div class="message-name">Koenraad</div>
                <p>Hallo, ik ben Koenraad, jouw digitale websitebouwer.</p>
                <p>Vertel me iets over jezelf en wat je doet. Ik luister.</p>
            </div>
        </div>

        <form id="chat-form" class="input-area">
            <textarea
                id="message-input"
                placeholder="Vertel me iets over jezelf en wat je doet..."
                rows="3"
                required
            ></textarea>

            <button type="submit">Verstuur</button>
        </form>

    </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
